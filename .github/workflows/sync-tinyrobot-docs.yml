name: Sync TinyRobot docs into skills

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: TinyRobot branch, tag, or commit to snapshot
        required: true
        default: release/v1.0.x
        type: string

permissions:
  contents: read

jobs:
  sync-snapshot:
    runs-on: ubuntu-latest

    steps:
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10'

      - name: Checkout current repo
        uses: actions/checkout@v4
        with:
          path: current-repo
          token: ${{ secrets.MY_GITHUB_PUSH_TOKEN }}

      - name: Checkout TinyRobot source
        uses: actions/checkout@v4
        with:
          repository: opentiny/tiny-robot
          path: tinyrobot-repo
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.MY_GITHUB_PUSH_TOKEN }}

      - name: Record TinyRobot source commit
        id: tinyrobot-source
        working-directory: tinyrobot-repo
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install sync tooling
        working-directory: current-repo/scripts
        run: pnpm install --frozen-lockfile

      - name: Generate TinyRobot skill snapshot
        working-directory: current-repo/scripts
        run: >-
          pnpm tiny-robot-skill-sync --
          --source-root "$GITHUB_WORKSPACE/tinyrobot-repo"
          --skill-root "$GITHUB_WORKSPACE/current-repo/skills/tiny-robot-skill"
          --source-ref "${{ inputs.source_ref }}"
          --source-commit "${{ steps.tinyrobot-source.outputs.commit }}"

      - name: Validate TinyRobot skill
        working-directory: current-repo/scripts
        run: pnpm validate:tiny-robot-skill

      - name: Commit and push
        working-directory: current-repo
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add skills/tiny-robot-skill
          git diff --quiet && git diff --staged --quiet || (git commit -m "Sync TinyRobot docs to tiny-robot-skill" && git push)
